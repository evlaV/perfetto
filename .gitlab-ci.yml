stages:
  - build

build-perfetto-ui:
  stage: build
  image:
    name: debian:latest
  script:
    # Install dependencies and perform build
    - apt update && apt install -y python3 git curl build-essential python3.13-venv
    - ./tools/install-build-deps --ui && ./ui/build
    # Document root must be `public`
    - mv ui/out/dist public
  # This tells gitlab that we're building a pages site
  pages: true
  tags:
    - "x86_64-linux-kvm-docker-heavy"

