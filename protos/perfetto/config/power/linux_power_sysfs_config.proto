syntax = "proto2";

package perfetto.protos;

// Data source that reads battery and charger state from the Linux
// power_supply sysfs. On devices that expose a charging daemon (e.g. Steam
// Frame's deckard-charger) and an onboard power rail monitor via hwmon, it
// also reports the charger-reported battery state and per-rail power draw.
message LinuxPowerSysfsConfig {
  // Frequency of polling, in milliseconds. If unset (or zero), the data
  // source falls back to a sensible built-in default.
  // This is required to be > 10ms to avoid excessive CPU usage.
  optional uint32 poll_ms = 1;
}
